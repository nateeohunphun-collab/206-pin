<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELD-101 การออกแบบและพัฒนา e-Learning</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&family=Sarabun:wght@400;700&display=swap');

        :root {
            --primary-teal: #005a66;
            --primary-teal-light: #e0f2f4;
            --primary-teal-hover: #00444d;
            --accent-brick: #c25934;
            --bg-main: #fcfcfc;
            --bg-sidebar: #f0f4f5;
            --bg-card: #ffffff;
            --text-main: #222222;
            --text-muted: #555555;
            --border: #dddddd;
            --success: #2e7d32;
            --error: #c62828;
            --focus-ring: #c25934;
        }

        [data-theme="dark"] {
            --primary-teal: #4dd0e1;
            --primary-teal-light: #00363d;
            --primary-teal-hover: #80deea;
            --accent-brick: #ff8a65;
            --bg-main: #121212;
            --bg-sidebar: #1a1a1a;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --border: #333333;
            --success: #66bb6a;
            --error: #ef5350;
            --focus-ring: #ff8a65;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --primary-teal: #4dd0e1;
                --primary-teal-light: #00363d;
                --primary-teal-hover: #80deea;
                --accent-brick: #ff8a65;
                --bg-main: #121212;
                --bg-sidebar: #1a1a1a;
                --bg-card: #1e1e1e;
                --text-main: #e0e0e0;
                --text-muted: #aaaaaa;
                --border: #333333;
                --success: #66bb6a;
                --error: #ef5350;
                --focus-ring: #ff8a65;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
        }

        body {
            font-family: 'Sarabun', sans-serif;
            font-size: 17px;
            line-height: 1.7;
            color: var(--text-main);
            background-color: var(--bg-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        h1, h2, h3, h4, h5 { font-family: 'Prompt', sans-serif; font-weight: 600; color: var(--primary-teal); margin-bottom: 1rem; }
        h1 { font-size: 1.8rem; }
        h2 { font-size: 1.5rem; }
        
        a, button, input, select {
            font-family: inherit;
        }

        :focus-visible {
            outline: 3px solid var(--focus-ring);
            outline-offset: 2px;
        }

        /* Layout */
        #sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        #main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - 280px);
        }

        header {
            padding: 1rem 2rem;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #content {
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        /* UI Elements */
        button {
            background-color: var(--primary-teal);
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        
        [data-theme="dark"] button { color: #121212; }

        button:hover { background-color: var(--primary-teal-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        button.outline {
            background-color: transparent;
            color: var(--primary-teal);
            border: 2px solid var(--primary-teal);
        }
        [data-theme="dark"] button.outline { color: var(--primary-teal); }
        button.outline:hover { background-color: var(--primary-teal-light); }

        .btn-brick { background-color: var(--accent-brick); color: #fff; }
        [data-theme="dark"] .btn-brick { color: #121212; }

        input[type="text"] {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            background-color: var(--bg-card);
            color: var(--text-main);
            font-size: 1rem;
        }

        /* Sidebar Nav */
        .nav-item {
            display: block;
            padding: 0.8rem;
            margin-bottom: 0.5rem;
            border-radius: 4px;
            background: transparent;
            border: none;
            text-align: left;
            width: 100%;
            color: var(--text-main);
            text-decoration: none;
        }
        .nav-item:hover:not(:disabled) { background-color: var(--primary-teal-light); }
        .nav-item.active { background-color: var(--primary-teal-light); font-weight: bold; border-left: 4px solid var(--primary-teal); }
        .nav-item .status { float: right; }
        
        #menu-toggle { display: none; background: transparent; color: var(--primary-teal); font-size: 1.5rem; padding: 0.5rem; }
        [data-theme="dark"] #menu-toggle { color: var(--primary-teal); }

        /* Typography & Content Layout */
        .text-max { max-width: 70ch; }
        .note { border-left: 4px solid var(--accent-brick); padding: 1rem; background-color: var(--primary-teal-light); margin: 1.5rem 0; }
        .citation { font-size: 0.9rem; color: var(--text-muted); margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem; }
        
        table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; }
        th, td { border: 1px solid var(--border); padding: 0.8rem; text-align: left; }
        th { background-color: var(--primary-teal-light); color: var(--text-main); }

        ul.no-emoji { list-style-type: disc; margin-left: 2rem; margin-bottom: 1.5rem; }
        ul.no-emoji li { margin-bottom: 0.5rem; }

        /* Cards & Assessment */
        .question-card { margin-bottom: 2rem; border: 1px solid var(--border); padding: 1.5rem; }
        .option-label {
            display: block; padding: 0.8rem; border: 1px solid var(--border); margin-bottom: 0.5rem; cursor: pointer; border-radius: 4px;
        }
        .option-label:hover { background-color: var(--primary-teal-light); }
        .option-label input { margin-right: 1rem; }
        
        .feedback { margin-top: 1rem; padding: 1rem; display: none; border-radius: 4px; }
        .feedback.correct { display: block; background-color: #e8f5e9; border: 1px solid var(--success); color: #1b5e20; }
        .feedback.incorrect { display: block; background-color: #ffebee; border: 1px solid var(--error); color: #b71c1c; }
        [data-theme="dark"] .feedback.correct { background-color: #003300; color: #a5d6a7; }
        [data-theme="dark"] .feedback.incorrect { background-color: #330000; color: #ef9a9a; }

        /* Activities */
        .activity-box { border: 1px solid var(--primary-teal); padding: 1.5rem; margin: 1.5rem 0; }
        .sort-item { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; border: 1px solid var(--border); margin-bottom: 0.5rem; background: var(--bg-card); }
        .sort-controls button { padding: 0.2rem 0.6rem; font-size: 0.9rem; margin-left: 0.3rem; }
        .match-row { display: flex; flex-direction: column; margin-bottom: 1rem; }
        .match-row select { padding: 0.5rem; font-size: 1rem; margin-top: 0.5rem; background-color: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); }
        
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body { position: relative; }
            #sidebar { position: fixed; top: 0; left: -280px; height: 100vh; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
            #sidebar.open { transform: translateX(280px); }
            #main-container { width: 100%; }
            #menu-toggle { display: block; }
            #content { padding: 1rem; }
            .nav-buttons { flex-direction: column; gap: 1rem; }
            .nav-buttons button { width: 100%; }
        }
    </style>
</head>

        <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border);">
            <button id="theme-toggle" class="outline" style="width:100%; margin-bottom:1rem;">สลับธีมสี</button>

    { id: 'q2', text: 'ข้อใดคือลักษณะสำคัญของโมเดล ADDIE?', options: [{t:'ต้องทำเป็นเส้นตรงห้ามย้อนกลับ',c:false}, {t:'เป็นกระบวนการที่ย้อนกลับและทำซ้ำได้ (Iterative)',c:true}, {t:'ใช้สำหรับสื่อแบบสิ่งพิมพ์เท่านั้น',c:false}, {t:'ไม่มีการประเมินผลระหว่างการสร้างสื่อ',c:false}], exp: 'ADDIE เป็นกระบวนการที่ปรับปรุงและย้อนกลับไปแก้ไขขั้นก่อนหน้าได้เสมอ (Iterative process)' },

        pages: [
            { type: 'content', title: "นิยามและรูปแบบ", html: `
                <p><strong>e-Learning</strong> คือการใช้เทคโนโลยีดิจิทัลเพื่อการเรียนการสอน แบ่งรูปแบบหลักตามเวลาได้ 2 ประเภท:</p>

                <p>วัตถุประสงค์เชิงพฤติกรรมต้อง <strong>สังเกตได้และวัดได้</strong> หลีกเลี่ยงคำว่า "เข้าใจ" หรือ "รู้" แต่ใช้คำกริยาที่สะท้อนพฤติกรรมตามระดับความรู้ (Anderson & Krathwohl, 2001)</p>

/* ======================== SYSTEM & STORAGE ======================== */
const storage = {
    set: (key, val) => { try { localStorage.setItem('ELD101_' + key, JSON.stringify(val)); } catch(e){} },
    get: (key) => { try { return JSON.parse(localStorage.getItem('ELD101_' + key)); } catch(e){ return null; } },
    clear: () => { 
        try { 
            Object.keys(localStorage).forEach(k => { if(k.startsWith('ELD101_')) localStorage.removeItem(k); });
        } catch(e){} 
    }
};

let state = {
    nickname: storage.get('nickname') || '',
    route: storage.get('route') || 'home',
    mod: storage.get('mod') || 'mod1',
    pageIdx: storage.get('pageIdx') || 0,
    preScore: storage.get('preScore'),
    postScore: storage.get('postScore'),
    completed: storage.get('completed') || { mod1: false, mod2: false, mod3: false, mod4: false }
};

const saveState = () => {
    storage.set('nickname', state.nickname);
    storage.set('route', state.route);
    storage.set('mod', state.mod);
    storage.set('pageIdx', state.pageIdx);
    storage.set('preScore', state.preScore);
    storage.set('postScore', state.postScore);
    storage.set('completed', state.completed);
    updateSidebar();
};

const shuffle = (array) => {
    let copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
};

/* ======================== ROUTING & RENDERING ======================== */
const contentDiv = document.getElementById('content');

const render = () => {
    document.getElementById('user-display').textContent = state.nickname ? `ผู้เรียน: ${state.nickname}` : '';
    
    if (state.route === 'home') renderHome();
    else if (state.route === 'pretest') renderTest('pre');
    else if (state.route === 'posttest') renderTest('post');
    else if (state.route === 'summary') renderSummary();
    else if (state.route === 'module') renderModule();
    
    window.scrollTo(0, 0);
    saveState();
};

const navButtons = (prevFn, nextFn, nextText = 'ถัดไป', nextDisabled = false) => `
    <div class="nav-buttons">
        ${prevFn ? `<button onclick="${prevFn}" class="outline">ย้อนกลับ</button>` : '<div></div>'}
        ${nextFn ? `<button onclick="${nextFn}" id="btn-next" ${nextDisabled ? 'disabled' : ''}>${nextText}</button>` : ''}
    </div>
`;

};

window.startCourse = () => {
    const nn = document.getElementById('nickname').value.trim();
    state.nickname = nn || 'ผู้เรียนนิรนาม';
    if(state.preScore !== null && state.preScore !== undefined) {
        state.route = 'module'; state.mod = 'mod1'; state.pageIdx = 0;
    } else {
        state.route = 'pretest';
    }
    render();
};

/* ----- TESTS (Pre/Post) ----- */
const renderTest = (type) => {
    if(type === 'pre' && state.preScore !== null && state.preScore !== undefined) {
        state.route = 'module'; state.mod = 'mod1'; state.pageIdx = 0; render(); return;
    }
    if(type === 'post' && state.postScore !== null && state.postScore !== undefined) {
        state.route = 'summary'; render(); return;
    }

    const title = type === 'pre' ? 'แบบทดสอบก่อนเรียน (8 ข้อ)' : 'แบบทดสอบหลังเรียน (8 ข้อ)';
    const desc = type === 'pre' ? 'ไม่มีการตัดสินผ่าน/ไม่ผ่าน ทำเพื่อวัดความรู้พื้นฐาน' : 'ทดสอบความรู้หลังจากเรียนครบทุกบท';
    
    let html = `<h1>${title}</h1><p>${desc}</p><form id="test-form">`;
    
    questionsData.forEach((q, idx) => {
        const shuffledOptions = shuffle(q.options);
        html += `<div class="question-card">
            <h4>ข้อ ${idx+1}. ${q.text}</h4>
            ${shuffledOptions.map((opt, oIdx) => `
                <label class="option-label">
                    <input type="radio" name="${q.id}" value="${opt.c}" required>
                    ${opt.t}
                </label>
            `).join('')}
        </div>`;
    });
    
    html += `<button type="submit" class="btn-brick" style="width:100%; padding:1rem; margin-bottom:2rem;">ส่งคำตอบ</button></form>`;
    contentDiv.innerHTML = html;

    document.getElementById('test-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        let score = 0;
        let keysChecked = 0;
        for (let [key, val] of formData.entries()) { keysChecked++; if(val === 'true') score++; }
        
        if(keysChecked < 8) return; // safety, html5 required should handle it
        
        if(type === 'pre') {
            state.preScore = score;
            contentDiv.innerHTML = `<h1>ส่งคำตอบเรียบร้อย</h1><p>คุณทำแบบทดสอบก่อนเรียนเสร็จแล้ว เข้าสู่เนื้อหาบทที่ 1</p>${navButtons(null, 'goToMod1()', 'เริ่มเรียนบทที่ 1')}`;
        } else {
            state.postScore = score;
            contentDiv.innerHTML = `<h1>ส่งคำตอบเรียบร้อย</h1><p>ระบบบันทึกคะแนนหลังเรียนแล้ว</p>${navButtons(null, 'goToSummary()', 'ดูสรุปผล')}`;
        }
        saveState();
    });
};

window.goToMod1 = () => { state.route = 'module'; state.mod = 'mod1'; state.pageIdx = 0; render(); };
window.goToSummary = () => { state.route = 'summary'; render(); };

/* ----- MODULE CONTENT ----- */
const renderModule = () => {
    const modData = courseModules[state.mod];
    const page = modData.pages[state.pageIdx];
    
    let html = `<h2>${modData.title}</h2><div style="margin-bottom:2rem; font-size:0.9rem; color:var(--text-muted);">หน้าที่ ${state.pageIdx + 1} / ${modData.pages.length}</div>`;
    
    if(page.type === 'content') {
        html += `<h3>${page.title}</h3>${page.html}`;
        html += navButtons('modPrev()', 'modNext()');
        contentDiv.innerHTML = html;
    } 
    else if(page.type === 'activity') {
        html += `<h3>${page.title}</h3>${page.html}`;
        html += navButtons('modPrev()', 'modNext()', 'ถัดไป', true);
        contentDiv.innerHTML = html;
        setupActivity(page.id);
    }
    else if(page.type === 'quiz') {
        html += `<h3>${page.title}</h3><p style="margin-bottom:1.5rem;">ตอบคำถามเพื่อไปต่อ (มีคำอธิบายเฉลย)</p>`;
        page.qIds.forEach((qid, idx) => {
            const q = questionsData.find(x => x.id === qid);
            const shuffledOptions = shuffle(q.options);
            html += `<div class="question-card" id="qcard-${qid}">
                <h4>ข้อ ${idx+1}. ${q.text}</h4>
                ${shuffledOptions.map(opt => `
                    <label class="option-label">
                        <input type="radio" name="${qid}" value="${opt.c}">
                        ${opt.t}
                    </label>
                `).join('')}
                <div class="feedback" id="fb-${qid}">${q.exp}</div>
            </div>`;
        });
        html += `<button id="check-quiz" class="btn-brick">ตรวจคำตอบ</button>`;
        html += `<div id="quiz-nav" style="display:none;">${navButtons('modPrev()', 'modNext()', state.pageIdx === modData.pages.length - 1 ? 'จบหัวข้อนี้' : 'ถัดไป')}</div>`;
        contentDiv.innerHTML = html;

        document.getElementById('check-quiz').addEventListener('click', () => {
            let allAnswered = true;
            page.qIds.forEach(qid => {
                const selected = document.querySelector(`input[name="${qid}"]:checked`);
                if(!selected) allAnswered = false;
            });
            if(!allAnswered) return;

            page.qIds.forEach(qid => {
                const selected = document.querySelector(`input[name="${qid}"]:checked`);
                const fb = document.getElementById(`fb-${qid}`);
                if(selected.value === 'true') {
                    fb.className = 'feedback correct';
                    fb.innerHTML = `<strong>ถูกต้อง!</strong> ${questionsData.find(x => x.id === qid).exp}`;
                } else {
                    fb.className = 'feedback incorrect';
                    fb.innerHTML = `<strong>ไม่ถูกต้อง</strong> - เฉลย: ${questionsData.find(x => x.id === qid).exp}`;
                }
            });
            document.getElementById('check-quiz').style.display = 'none';
            document.getElementById('quiz-nav').style.display = 'block';
            
            // disable inputs
            page.qIds.forEach(qid => {
                document.querySelectorAll(`input[name="${qid}"]`).forEach(inp => inp.disabled = true);
            });
        });
    }
};

window.modPrev = () => {
    if(state.pageIdx > 0) {
        state.pageIdx--;
        render();
    } else {
        // Go to previous module if not mod1
        const mods = Object.keys(courseModules);
        const curIdx = mods.indexOf(state.mod);
        if(curIdx > 0) {
            state.mod = mods[curIdx - 1];
            state.pageIdx = courseModules[state.mod].pages.length - 1;
            render();
        }
    }
};

window.modNext = () => {
    const modData = courseModules[state.mod];
    if(state.pageIdx < modData.pages.length - 1) {
        state.pageIdx++;
        render();
    } else {
        // Mark module complete
        state.completed[state.mod] = true;
        const mods = Object.keys(courseModules);
        const curIdx = mods.indexOf(state.mod);
        if(curIdx < mods.length - 1) {
            state.mod = mods[curIdx + 1];
            state.pageIdx = 0;
            render();
        } else {
            // Finished all modules -> Post test
            state.route = 'posttest';
            render();
        }
    }
};

/* ----- ACTIVITIES SETUP ----- */
const setupActivity = (id) => {
    const unlockNext = () => { document.getElementById('btn-next').disabled = false; };
    
    if(id === 'act_mod1') { // ADDIE Sort
        let items = [
            { id: 2, t: 'Design (ออกแบบ)' },
            { id: 5, t: 'Evaluation (ประเมิน)' },
            { id: 1, t: 'Analysis (วิเคราะห์)' },
            { id: 4, t: 'Implementation (นำไปใช้)' },
            { id: 3, t: 'Development (พัฒนา)' }
        ];
        
        const renderSort = () => {
            let sHtml = '';
            items.forEach((item, i) => {
                sHtml += `<div class="sort-item">
                    <span>${i+1}. ${item.t}</span>
                    <div class="sort-controls">
                        <button onclick="moveItem(${i}, -1)" ${i === 0 ? 'disabled' : ''}>▲ เลื่อนขึ้น</button>
                        <button onclick="moveItem(${i}, 1)" ${i === items.length-1 ? 'disabled' : ''}>▼ เลื่อนลง</button>
                    </div>
                </div>`;
            });
            document.getElementById('sort-container').innerHTML = sHtml;
        };
        window.moveItem = (idx, dir) => {
            const temp = items[idx];
            items[idx] = items[idx+dir];
            items[idx+dir] = temp;
            renderSort();
        };
        renderSort();

        document.getElementById('check-act1').addEventListener('click', () => {
            const correctOrder = [1,2,3,4,5];
            const isCorrect = items.every((val, index) => val.id === correctOrder[index]);
            const fb = document.getElementById('act1-feedback');
            if(isCorrect) {
                fb.className = 'feedback correct'; fb.textContent = 'ถูกต้อง! Analysis -> Design -> Development -> Implementation -> Evaluation';
                unlockNext();
            } else {
                fb.className = 'feedback incorrect'; fb.textContent = 'ยังไม่ถูกต้อง ลองจัดลำดับใหม่ (A-D-D-I-E)';
            }
        });
    }
    
    if(id === 'act_mod2') { // Match Gagné
        const opts = `<option value="">-- เลือกขั้นตอน --</option><option value="1">1. เร้าความสนใจ</option><option value="2">2. แจ้งวัตถุประสงค์</option><option value="3">3. กระตุ้นความรู้เดิม</option><option value="6">6. ให้ลงมือปฏิบัติ</option><option value="7">7. ให้ Feedback</option>`;
        const q = [
            { text: 'ครูเริ่มคลาสด้วยการเปิดคลิปเหตุการณ์สั้น ๆ ที่น่าตื่นเต้น', ans: '1' },
            { text: 'ครูบอกนักเรียนว่า "ท้ายคาบนี้ทุกคนจะต้องเขียนโค้ดวนซ้ำได้"', ans: '2' },
            { text: 'ครูตั้งคำถามว่า "จำสัปดาห์ที่แล้วที่เราเรียนเรื่องตัวแปรได้ไหม?"', ans: '3' },
            { text: 'ครูให้นักเรียนลองเขียนโปรแกรมตามโจทย์ที่กำหนดบนกระดาน', ans: '6' }
        ];
        document.getElementById('match-container').innerHTML = q.map((x,i) => `<div class="match-row"><label>${x.text}</label><select id="gagne-q${i}">${opts}</select></div>`).join('');
        
        document.getElementById('check-act2').addEventListener('click', () => {
            let correctCount = 0;
            q.forEach((x,i) => {
                const sel = document.getElementById(`gagne-q${i}`);
                if(sel.value === x.ans) { sel.style.borderColor = 'var(--success)'; correctCount++; }
                else { sel.style.borderColor = 'var(--error)'; }
            });
            const fb = document.getElementById('act2-feedback');
            if(correctCount === q.length) {
                fb.className = 'feedback correct'; fb.textContent = 'ยอดเยี่ยม! จับคู่ได้ถูกต้องทั้งหมด'; unlockNext();
            } else {
                fb.className = 'feedback incorrect'; fb.textContent = 'ยังไม่ถูกทั้งหมด สังเกตกรอบสีแดงแล้วลองใหม่';
            }
        });
    }

    if(id === 'act_mod3') { // Diagnose Mayer
        const opts = `<option value="">-- เลือกหลักการที่ถูกละเมิด --</option><option value="red">Redundancy (ซ้ำซ้อน)</option><option value="coh">Coherence (ไม่สอดคล้อง)</option><option value="spa">Spatial Contiguity (แยกพื้นที่)</option>`;
        const q = [
            { text: 'ครูเปิดสไลด์ที่มีตัวหนังสือเต็มหน้า และยืนอ่านตามตัวหนังสือทุกคำเป๊ะ ๆ', ans: 'red' },
            { text: 'สไลด์อธิบายชิ้นส่วนคอมพิวเตอร์ แต่รูปภาพอยู่หน้า 1 ส่วนคำอธิบายชื่อชิ้นส่วนไปอยู่หน้า 2', ans: 'spa' },
            { text: 'หน้าจอมีเนื้อหาสำคัญ แต่ใส่กรอบลวดลายดอกไม้ฉูดฉาดและมีเพลงตื่นเต้นประกอบตลอดเวลา', ans: 'coh' }
        ];
        document.getElementById('diagnose-container').innerHTML = q.map((x,i) => `<div class="match-row"><label><strong>สถานการณ์:</strong> ${x.text}</label><select id="mayer-q${i}">${opts}</select></div>`).join('');
        
        document.getElementById('check-act3').addEventListener('click', () => {
            let correctCount = 0;
            q.forEach((x,i) => {
                const sel = document.getElementById(`mayer-q${i}`);
                if(sel.value === x.ans) { sel.style.borderColor = 'var(--success)'; correctCount++; }
                else { sel.style.borderColor = 'var(--error)'; }
            });
            const fb = document.getElementById('act3-feedback');
            if(correctCount === q.length) {
                fb.className = 'feedback correct'; fb.textContent = 'ถูกต้องทั้งหมด! การลดภาระสมองเป็นสิ่งสำคัญ'; unlockNext();
            } else {
                fb.className = 'feedback incorrect'; fb.textContent = 'ยังมีจุดที่วินิจฉัยผิด ลองพิจารณาใหม่';
            }
        });
    }

    if(id === 'act_mod4') { // Kirkpatrick
        const opts = `<option value="">-- เลือกระดับ --</option><option value="1">L1: Reaction (ความพึงพอใจ)</option><option value="2">L2: Learning (การเรียนรู้)</option><option value="3">L3: Behavior (พฤติกรรม/นำไปใช้)</option><option value="4">L4: Results (ผลลัพธ์องค์กร)</option>`;
        const q = [
            { text: 'คะแนนแบบทดสอบหลังเรียน (Post-test score)', ans: '2' },
            { text: 'แบบสอบถาม "ความชอบ" ต่อสีสันและเสียงของสื่อ', ans: '1' },
            { text: 'จำนวนของเสียในการผลิตลดลง 10% หลังจบการอบรมพนักงาน', ans: '4' },
            { text: 'ผู้เรียนสามารถเขียนแผนการสอนจริงส่งหัวหน้าหมวดได้ถูกต้องหลังเรียนจบ', ans: '3' }
        ];
        document.getElementById('kp-container').innerHTML = q.map((x,i) => `<div class="match-row"><label>${x.text}</label><select id="kp-q${i}">${opts}</select></div>`).join('');
        
        document.getElementById('check-act4').addEventListener('click', () => {
            let correctCount = 0;
            q.forEach((x,i) => {
                const sel = document.getElementById(`kp-q${i}`);
                if(sel.value === x.ans) { sel.style.borderColor = 'var(--success)'; correctCount++; }
                else { sel.style.borderColor = 'var(--error)'; }
            });
            const fb = document.getElementById('act4-feedback');
            if(correctCount === q.length) {
                fb.className = 'feedback correct'; fb.textContent = 'ถูกต้อง! การเลือกหลักฐานให้ตรงระดับช่วยให้วัดผลได้แม่นยำ'; unlockNext();
            } else {
                fb.className = 'feedback incorrect'; fb.textContent = 'ยังมีข้อที่จับคู่ไม่ตรง ลองทบทวนเนื้อหาอีกครั้ง';
            }
        });
    }
};

/* ----- SUMMARY ----- */
const renderSummary = () => {
    let modsDone = 0;
    Object.keys(state.completed).forEach(k => { if(state.completed[k]) modsDone++; });
    
    let pre = state.preScore !== null ? state.preScore : 0;
    let post = state.postScore !== null ? state.postScore : 0;
    let max = 8;
    
    let gainStr = '';
    let gainNum = 0;
    if (pre === max) {
        if (post < max) gainStr = "N/A (คะแนนลดลง)";
        else gainStr = "N/A (คะแนนก่อนเรียนเต็มแล้ว)";
    } else {
        gainNum = (post - pre) / (max - pre);
        if (gainNum < 0) gainStr = "ติดลบ (คะแนนลดลง)";
        else gainStr = gainNum.toFixed(2);
    }

    let interpretation = "";
    if (gainNum >= 0.7) interpretation = "การพัฒนาอยู่ในเกณฑ์สูง (High gain)";
    else if (gainNum >= 0.3) interpretation = "การพัฒนาอยู่ในเกณฑ์ปานกลาง (Medium gain)";
    else if (gainNum > 0) interpretation = "การพัฒนาอยู่ในเกณฑ์ต่ำ (Low gain)";
    else interpretation = "ไม่พบพัฒนาการเชิงบวก";

    if(pre === max && post === max) interpretation = "ผู้เรียนมีความรู้พื้นฐานครบถ้วนสมบูรณ์แล้ว";

    contentDiv.innerHTML = `
        <h1>สรุปผลการเรียนรู้</h1>
        <div style="background: var(--bg-card); border: 1px solid var(--border); padding: 2rem; border-radius: 4px; margin-bottom: 2rem;">
            <p style="font-size: 1.2rem; margin-bottom: 1rem;">ผู้เรียน: <strong>${state.nickname}</strong></p>
            <table style="margin-bottom: 0;">
                <tr><th style="width:50%;">หัวข้อ</th><th>ผลลัพธ์</th></tr>
                <tr><td>บทเรียนที่สำเร็จ</td><td>${modsDone} / 4</td></tr>
                <tr><td>คะแนนทดสอบก่อนเรียน (Pre-test)</td><td>${pre} / ${max}</td></tr>
                <tr><td>คะแนนทดสอบหลังเรียน (Post-test)</td><td>${post} / ${max}</td></tr>
                <tr style="background: var(--primary-teal-light);">
                    <td><strong>Normalized Gain (ดัชนีพัฒนาการ)</strong><br><small style="font-weight:normal;">สูตร: (หลัง - ก่อน) / (เต็ม - ก่อน)</small></td>
                    <td><strong>${gainStr}</strong></td>
                </tr>
            </table>
        </div>
        
        <div class="note">
            <strong>การแปลผล:</strong> ${interpretation}<br>
            <small>* หมายเหตุ: แบบทดสอบชุดนี้มีข้อจำกัดด้านจำนวนข้อ (8 ข้อ) ผลการประเมินรายบุคคลนี้ใช้เพื่อเป็นแนวทาง (Formative purpose) ในการพัฒนาตนเองเบื้องต้น ไม่เหมาะสำหรับใช้ตัดสินผลสัมฤทธิ์ทางการศึกษาอย่างเป็นทางการ</small>
        </div>
        
        <div style="text-align:center; margin-top: 3rem;">
            <button onclick="document.getElementById('reset-btn').click()" class="outline">เริ่มคอร์สใหม่ทั้งหมด</button>
        </div>
    `;
};


/* ----- SIDEBAR & UI LOGIC ----- */
const updateSidebar = () => {
    let navHtml = `<button class="nav-item ${state.route === 'home' ? 'active' : ''}" onclick="navTo('home')">หน้าแรก</button>`;
    
    let preStatus = state.preScore !== null ? '✓' : '';
    navHtml += `<button class="nav-item ${state.route === 'pretest' ? 'active' : ''}" onclick="navTo('pretest')">ก่อนเรียน <span class="status">${preStatus}</span></button>`;
    
    Object.keys(courseModules).forEach((modId, i) => {
        let isDone = state.completed[modId] ? '✓' : '';
        let isActive = (state.route === 'module' && state.mod === modId) ? 'active' : '';
        // Only allow clicking if pretest is done
        let disabled = state.preScore === null ? 'disabled' : '';
        navHtml += `<button class="nav-item ${isActive}" onclick="navToMod('${modId}')" ${disabled}>บทที่ ${i+1} <span class="status" style="color:var(--success)">${isDone}</span></button>`;
    });

    let postStatus = state.postScore !== null ? '✓' : '';
    let allModDone = Object.values(state.completed).every(v => v === true);
    let postDisabled = (!allModDone || state.postScore !== null) ? 'disabled' : '';
    navHtml += `<button class="nav-item ${state.route === 'posttest' ? 'active' : ''}" onclick="navTo('posttest')" ${postDisabled}>หลังเรียน <span class="status">${postStatus}</span></button>`;
    
    let sumDisabled = state.postScore === null ? 'disabled' : '';
    navHtml += `<button class="nav-item ${state.route === 'summary' ? 'active' : ''}" onclick="navTo('summary')" ${sumDisabled}>สรุปผล</button>`;
    
    document.getElementById('nav-links').innerHTML = navHtml;
};

window.navTo = (route) => {
    if(route === 'pretest' && state.preScore !== null) return;
    if(route === 'posttest' && state.postScore !== null) { state.route = 'summary'; render(); return; }
    state.route = route; render();
};

window.navToMod = (modId) => {
    if(state.preScore === null) return;
    state.route = 'module'; state.mod = modId; state.pageIdx = 0; render();
};

/* ----- THEME & RESET ----- */
const themeToggle = document.getElementById('theme-toggle');
themeToggle.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    storage.set('themePrefs', next);
});

// Init theme
const savedTheme = storage.get('themePrefs');
if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
}

let resetState = 0;
let resetTimer;
document.getElementById('reset-btn').addEventListener('click', (e) => {
    if(resetState === 0) {
        e.target.textContent = "คลิกอีกครั้งเพื่อยืนยัน";
        resetState = 1;
        resetTimer = setTimeout(() => {
            resetState = 0;
            e.target.textContent = "เริ่มใหม่";
        }, 3000);
    } else {
        clearTimeout(resetTimer);
        storage.clear();
        location.reload();
    }
});

/* Mobile Sidebar Toggle */
const sidebar = document.getElementById('sidebar');
document.getElementById('menu-toggle').addEventListener('click', () => {
    sidebar.classList.toggle('open');
});
// Close sidebar when clicking outside on mobile
document.getElementById('main-container').addEventListener('click', (e) => {
    if (window.innerWidth <= 768 && e.target.id !== 'menu-toggle') {
        sidebar.classList.remove('open');
    }
});

/* Init */
updateSidebar();
render();

</script>
</body>
</html>
